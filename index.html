<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>GSM AD TALLER</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--cd:#15151a;--tx:#f3f3f5;--mu:#8b8b96;--ac:#ff2b2b;--bf:#fff;--sh:0 10px 22px #0009,inset 0 1px 0 #fff1;--bd:#2a2a33;--gl:0 0 18px #ff2b2b66;--bi:radial-gradient(520px 260px at 50% -60px,#ff2b2b30,#0000);--ft:system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root[data-t=l]{--bg:#f2f2f5;--cd:#fff;--tx:#141418;--mu:#6a6a76;--ac:#d6101c;--bd:#dcdce3;--sh:0 6px 16px #0002;--gl:0 2px 8px #0003;--bi:none}
:root[data-t=h]{--bg:#000;--cd:#021208;--tx:#3dff1a;--mu:#1fa33a;--ac:#3dff1a;--bf:#000;--bd:#0f4a1c;--sh:0 0 14px #3dff1a22;--gl:0 0 14px #3dff1a66;--bi:repeating-linear-gradient(#0000 0 3px,#3dff1a0d 3px 4px);--ft:ui-monospace,Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:#0000}
[hidden]{display:none!important}
body{margin:0;background:var(--bg) var(--bi) fixed;color:var(--tx);font:15px var(--ft);padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h2,.b{font-family:Rajdhani,var(--ft);letter-spacing:.06em;text-transform:uppercase}
h2{font-size:20px;margin:6px 0 10px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--bd)}
header img{width:46px;height:46px;border-radius:50%;object-fit:cover;box-shadow:0 2px 0 #333,0 0 14px var(--ac)}
header h1{margin:0;font:700 21px/1 Rajdhani,var(--ft);letter-spacing:.08em;text-transform:uppercase;text-shadow:var(--gl)}
header small{color:var(--ac);font:700 11px Rajdhani,var(--ft);letter-spacing:.4em}
main{max-width:640px;margin:auto;padding:14px 16px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:var(--sh)}
.k{border-left:3px solid var(--ac)}
label{display:block;font-size:12px;color:var(--mu)}
input,textarea,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:11px;font:inherit;margin:4px 0 10px}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--ac);box-shadow:var(--gl)}
button,.bt{display:inline-block;background:var(--ac);color:var(--bf);border:0;border-radius:10px;padding:10px 14px;font:700 15px Rajdhani,var(--ft);letter-spacing:.04em;box-shadow:inset 0 1px 0 #fff5,0 3px 0 #0006,var(--gl);text-decoration:none;transition:transform .1s}button:active,.bt:active{transform:translateY(2px)}
.g{background:none;color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bg{font:700 12px Rajdhani,var(--ft);padding:3px 10px;border-radius:99px;border:1px solid var(--ac);color:var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav a{flex:1;text-align:center;font:700 12px Rajdhani,var(--ft);color:var(--mu)}
nav a b{display:block;font-size:20px}nav a.on{color:var(--ac)}
.pt{display:grid;grid-template-columns:repeat(3,62px);gap:16px;touch-action:none;width:max-content;margin:8px auto}
.dt{width:62px;height:62px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font:700 20px Rajdhani}
.dt.on{background:var(--ac);color:var(--bf);box-shadow:var(--gl)}
canvas.sg{width:100%;aspect-ratio:3/1;background:#fff;border-radius:10px;margin:6px 0}
[contenteditable]:empty:before{content:"Toca para escribir…";color:var(--mu)}
.pv{overflow:auto;height:58vh;background:#2b2b30;border-radius:10px;margin-top:10px}
.pw{position:relative}.pw canvas{display:block;width:100%;background:#fff}
.pw canvas+canvas{position:absolute;left:0;top:0;height:100%;background:none;mix-blend-mode:multiply}
.hero{perspective:620px;text-align:center;padding:4px 0 18px;touch-action:pan-y}
.coin{width:132px;height:132px;margin:auto;border-radius:50%;position:relative;transition:transform .25s ease-out;box-shadow:0 1px 0 #444,0 2px 0 #3a3a3a,0 3px 0 #303030,0 4px 0 #262626,0 5px 0 #1c1c1c,0 24px 26px #000b,0 0 34px var(--ac)}
.coin img{width:100%;height:100%;border-radius:50%;display:block;object-fit:cover}
.coin::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,#fff6,#0000 42%,#0007);pointer-events:none}
#m{position:fixed;inset:0;background:#000c;display:none;place-items:center;z-index:20;padding:12px}#m.on{display:grid}
@media print{@page{size:50mm 30mm;margin:0}body>:not(#m){display:none!important}body{background:#fff;padding:0}#m{position:static;display:block;background:none;padding:0}#m div{background:none!important;padding:0!important}#m p{display:none}#m img{width:50mm!important}}
</style></head><body>
